name: Update profile stats

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate repository stats
        run: node scripts/update-repo-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_OWNER: whanxueyu

      - name: Commit stats changes
        run: |
          if [ -z "$(git status --porcelain images/repo-stars.svg)" ]; then
            echo "No repository stats changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/repo-stars.svg
          git commit -m "chore: update profile repository stats"
          git push
