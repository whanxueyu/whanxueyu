<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">whanxueyu profile header</title>
  <desc id="desc">A local static profile banner for whanxueyu.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.52" stop-color="#17324A"/>
      <stop offset="1" stop-color="#1F2937"/>
    </linearGradient>
    <linearGradient id="accent" x1="156" y1="72" x2="1044" y2="288" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="0.48" stop-color="#FACC15"/>
      <stop offset="1" stop-color="#FB7185"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" stroke="#94A3B8" stroke-opacity="0.13" stroke-width="1"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="18" fill="url(#grid)"/>
  <path d="M88 286L245 125L356 204L493 92L627 212L774 94L930 214L1110 84" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <path d="M92 294L248 148L360 222L493 116L627 236L774 116L929 236L1108 108V310H92V294Z" fill="url(#accent)" opacity="0.08"/>

  <g filter="url(#softShadow)">
    <rect x="96" y="70" width="1008" height="220" rx="16" fill="#0F172A" fill-opacity="0.76" stroke="#334155"/>
    <rect x="126" y="100" width="14" height="14" rx="7" fill="#FB7185"/>
    <rect x="150" y="100" width="14" height="14" rx="7" fill="#FACC15"/>
    <rect x="174" y="100" width="14" height="14" rx="7" fill="#5EEAD4"/>

    <text x="126" y="154" fill="#E5E7EB" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="800">whanxueyu</text>
    <text x="128" y="194" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600">Frontend Engineer / Software Developer</text>
    <text x="128" y="230" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="18">Vue | TypeScript | Node.js | WebGL | Cesium</text>

    <g transform="translate(740 112)">
      <rect x="0" y="0" width="292" height="132" rx="12" fill="#111827" stroke="#475569"/>
      <path d="M34 76L82 44L130 76L82 108L34 76Z" stroke="#5EEAD4" stroke-width="4" stroke-linejoin="round"/>
      <path d="M82 44V16L130 48V76" stroke="#FACC15" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M82 108V80L34 48V76" stroke="#FB7185" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="164" y="48" fill="#E5E7EB" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Build</text>
      <text x="164" y="78" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="15">interactive UI</text>
      <text x="164" y="104" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="15">3D visualization</text>
    </g>
  </g>
